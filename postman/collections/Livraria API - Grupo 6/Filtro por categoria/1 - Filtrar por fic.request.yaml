$kind: http-request
url: "{{baseUrl}}/livros?categoria=fic"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r\n    pm.response.to.have.status(200);\r\n});\r\nconst livros = pm.response.json();\r\nconst titulos = livros.map((l) => l.titulo);\r\npm.test(\"So livros de Ficcao\", function () {\r\n    livros.forEach((l) => pm.expect(l.categoria).to.eql(\"Ficção\"));\r\n});\r\npm.test(\"Veio O Hobbit\", function () {\r\n    pm.expect(titulos).to.include(\"O Hobbit\");\r\n});"
    language: text/javascript
order: 1000
