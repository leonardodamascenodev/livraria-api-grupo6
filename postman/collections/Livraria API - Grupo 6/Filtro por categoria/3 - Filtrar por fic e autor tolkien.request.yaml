$kind: http-request
url: "{{baseUrl}}/livros?categoria=fic&autor=tolkien"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r\n    pm.response.to.have.status(200);\r\n});\r\nconst livros = pm.response.json();\r\nconst titulos = livros.map((l) => l.titulo);\r\npm.test(\"So O Hobbit\", function () {\r\n    pm.expect(livros.length).to.be.above(0);\r\n    livros.forEach((l) => pm.expect(l.titulo).to.eql(\"O Hobbit\"));\r\n});"
    language: text/javascript
order: 3000
