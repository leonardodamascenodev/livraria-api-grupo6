$kind: http-request
url: "{{baseUrl}}/categorias/{{id_categoria_banco}}"
method: PATCH
body:
  type: json
  content: '{ "descricao": "De 6 a 10 anos" }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r\n    pm.response.to.have.status(200);\r\n});\r\npm.test(\"Descricao alterada\", function () {\r\n    pm.expect(pm.response.json().descricao).to.eql(\"De 6 a 10 anos\");\r\n});"
    language: text/javascript
order: 4000
