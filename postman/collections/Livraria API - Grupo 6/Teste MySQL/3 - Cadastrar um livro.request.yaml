$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
body:
  type: json
  content: "{\r

    \  \"titulo\": \"Dom Casmurro\",\r

    \  \"autor\": \"Machado de Assis\",\r

    \  \"preco\": 35.90,\r

    \  \"estoque\": 10\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Retorna status 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      if (pm.response.code === 201) {\r

      \    const livro = pm.response.json();\r

      \r

      \    pm.collectionVariables.set(\"livroId\", livro.id);\r

      \r

      \    console.log(\"ID criado:\", livro.id);\r

      }"
    language: text/javascript
order: 3000
