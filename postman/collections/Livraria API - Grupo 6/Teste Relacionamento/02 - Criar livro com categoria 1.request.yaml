$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
body:
  type: json
  content: '{ "titulo": "A Revolucao dos Bichos", "autor": "George Orwell", "preco": 29.9, "estoque": 5, "categoria_id": 1 }'
scripts:
