    code: "pm.test(\"Status code is 201\", function () {\r\n    pm.response.to.have.status(201);\r\n});\r\npm.test(\"Veio a categoria certa\", function () {\r\n    pm.expect(pm.response.json().categoria).to.eql(\"Ficção\");\r\n});\r\npm.environment.set(\"id_livro_com_categoria\", pm.response.json().id);"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
order: 2000
