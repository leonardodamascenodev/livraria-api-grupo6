$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
body:
  type: json
  content: '{ "titulo": "Livro Sem Categoria", "autor": "Ninguem", "preco": 10, "estoque": 1 }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 201\", function () {\r\n    pm.response.to.have.status(201);\r\n});\r\npm.test(\"Veio a categoria certa\", function () {\r\n    pm.expect(pm.response.json().categoria).to.eql(null);\r\n});\r\npm.environment.set(\"id_livro_sem_categoria\", pm.response.json().id);"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
order: 3000
