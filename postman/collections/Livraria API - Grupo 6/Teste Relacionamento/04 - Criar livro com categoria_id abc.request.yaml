$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
body:
  type: json
  content: '{ "titulo": "Livro Abc", "autor": "Ninguem", "preco": 10, "estoque": 1, "categoria_id": "abc" }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", function () {\r\n    pm.response.to.have.status(400);\r\n});"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
order: 4000
